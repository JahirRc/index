<script>
  var bg = document.getElementById('backgroundSound');
  var hoverSound = new Audio('./src/sounds/core_1.ogg');
  var clickSound = new Audio('./src/sounds/core_10.ogg');
  var toggle = document.getElementById('soundToggle');
  var soundOn = true;

  try {
    soundOn = localStorage.getItem('sound') !== 'off';
  } catch (e) {}

  hoverSound.volume = 0.4;
  clickSound.volume = 0.3;

  function play(audio) {
    var promise = audio.play();
    if (promise && promise.catch) promise.catch(function () {});
  }

  function updateToggle() {
    toggle.textContent = soundOn ? 'Sound: On' : 'Sound: Off';
    toggle.setAttribute('aria-pressed', String(soundOn));
  }

  function playBackground() {
    if (!soundOn) return;
    bg.volume = 0.2;
    play(bg);
  }

  function playEffect(audio) {
    if (!soundOn) return;
    if (!audio.paused) audio.currentTime = 0;
    play(audio);
  }

  updateToggle();

  toggle.addEventListener('click', function (event) {
    event.stopPropagation();
    soundOn = !soundOn;
    try {
      localStorage.setItem('sound', soundOn ? 'on' : 'off');
    } catch (e) {}
    updateToggle();
    if (soundOn) {
      playBackground();
    } else {
      bg.pause();
    }
  });

  document.addEventListener('click', playBackground);

  document.querySelectorAll('button:not(#soundToggle)').forEach(function (button) {
    button.addEventListener('mouseenter', function () { playEffect(hoverSound); });
    button.addEventListener('click', function () { playEffect(clickSound); });
  });

  var discordBtn = document.getElementById('discordBtn');
  var toast = document.getElementById('toast');
  var toastTimeout;

  discordBtn.addEventListener('click', function () {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText('JahirRc').catch(function () {});
    } else {
      var temp = document.createElement('textarea');
      temp.value = 'JahirRc';
      temp.style.position = 'fixed';
      temp.style.opacity = '0';
      document.body.appendChild(temp);
      temp.select();
      try {
        document.execCommand('copy');
      } catch (e) {}
      document.body.removeChild(temp);
    }

    clearTimeout(toastTimeout);
    toast.classList.add('show');
    toastTimeout = setTimeout(function () {
      toast.classList.remove('show');
    }, 3000);
  });
</script>
